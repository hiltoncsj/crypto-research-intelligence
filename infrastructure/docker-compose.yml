# Sprint 4 (Fase 23): este compose é para DESENVOLVIMENTO LOCAL — portas de Postgres/Redis
# publicadas no host (0.0.0.0) de propósito, para acesso via `psql`/`redis-cli`/Prisma Studio
# da máquina do desenvolvedor. Em produção, Redis e Postgres NUNCA devem ter portas expostas
# publicamente — usar rede interna do orquestrador (ex: rede privada do Docker/Kubernetes),
# sem `ports:` mapeado para a internet.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_research}
    ports:
      - "5433:5432"
    volumes:
      - crypto_research_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - crypto_research_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crypto_research_postgres_data:
  crypto_research_redis_data:
